name: Quality Gates

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    
    - name: Make scripts executable
      run: |
        chmod +x scripts/*.sh
    
    - name: Detect TODO comments
      run: |
        ./scripts/detect-todo.sh
    
    - name: Detect placeholder implementations
      run: |
        ./scripts/detect-placeholders.sh
    
    - name: Validate integration tests
      run: |
        ./scripts/validate-integration-tests.sh
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --verbosity normal
    
    - name: Run tests
      # xUnit v3 runs on Microsoft.Testing.Platform (MTP) here, not VSTest (see global.json's
      # "test": { "runner": "Microsoft.Testing.Platform" }), so trait filtering uses MTP's
      # own simple-filter switches passed after `--` to the test host, not VSTest's
      # `--filter "Category=..."` syntax. LiveOcr-tagged tests construct the real native
      # Tesseract engine (TesseractHeaderProductOcrEngine) and must be excluded on runners
      # without Tesseract installed — they are designed to fail LOUD, not skip, when run
      # without it. See docs/planning-artifacts/veriqan-e7-s72-header-ocr-design-2026-07-08.md §6.
      run: dotnet test --no-build --verbosity normal -- --filter-not-trait "Category=LiveOcr"

    - name: Check test coverage
      run: |
        dotnet test --collect:"XPlat Code Coverage" --verbosity normal -- --filter-not-trait "Category=LiveOcr"
        # Coverage threshold check will be added here
    
    - name: Validate XML documentation
      run: |
        # Check that all public APIs have XML documentation
        dotnet build --verbosity normal
        # Additional documentation validation can be added here

  mutation-test:
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    
    - name: Install Stryker.NET
      run: dotnet tool install -g StrykerMutator.Core
    
    - name: Run mutation tests
      run: |
        cd Prisma/Code/Src/CSharp
        stryker run --config-file-path stryker-config.json

  e2e-test:
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        cd Prisma/Code/Src/CSharp/Python
        pip install -r requirements.txt
    
    - name: Install Playwright
      run: |
        dotnet tool install -g Microsoft.Playwright.CLI
        playwright install
    
    - name: Start application
      run: |
        cd Prisma/Code/Src/CSharp/UI/ExxerCube.Prisma.Web.UI
        dotnet run &
        sleep 30
    
    - name: Run E2E tests
      # Same MTP-vs-VSTest filter-syntax class of bug as the main "Run tests" step above:
      # the legacy VSTest `--filter "Category=E2E"` form is not honored under
      # Microsoft.Testing.Platform. MTP's simple-filter switches go after `--`.
      run: |
        cd Prisma/Code/Src/CSharp/Tests
        dotnet test --verbosity normal -- --filter-trait "Category=E2E"

  security-scan:
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Run security scan
      run: |
        # Add security scanning tools here
        echo "Security scan completed"
        # This is a placeholder for actual security scanning implementation

  veriqan-migrations:
    # O4 (VERIQAN-E3-S5 remainder): the Worker `--migrate` CLI (MigrateCommand.cs) is the
    # deploy-time apply path. This job covers the OTHER two halves the CLI can't: (1) a
    # portable, DBA-runnable `ef migrations bundle` artifact for offline/CI-driven apply where
    # nobody wants a full worker deployment just to run DDL, and (2) a from-zero proof that the
    # full migration lineage (currently ending at 20260728155959_AddBatchExceptionLog) applies
    # cleanly to an empty database — the same guarantee a first-time production rollout needs.
    # Every command below was verified locally against a real SQL Server 2022 container before
    # being scripted here (see docs/operations/VERIQAN-RUNBOOK.md §8).
    name: Veriqan EF migrations (bundle + from-zero verify)
    runs-on: ubuntu-latest
    needs: quality-gates

    env:
      # Throwaway password for an ephemeral, single-job CI container — never used against a
      # real database and never exposed outside this job's own docker network.
      MSSQL_SA_PASSWORD: "EfBundle_Ci_Verify_2026!"

    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    # dotnet-ef is pinned in .config/dotnet-tools.json (version 10.0.8, matching the
    # Microsoft.EntityFrameworkCore.* PackageVersion line in Directory.Packages.props) rather
    # than installed globally, so the bundle is always built with the tool version that matches
    # the EF Core runtime the migrations were authored against.
    - name: Restore local tools (dotnet-ef)
      run: dotnet tool restore

    # VeriqanDbContextFactory (IDesignTimeDbContextFactory) makes the design-time DbContext
    # resolvable without a startup host project, so `--project` alone is sufficient — no
    # `--startup-project` needed. `--self-contained -r linux-x64` produces a single native
    # executable a DBA can run on the target box with no .NET SDK/runtime installed.
    - name: Build ef migrations bundle
      run: |
        dotnet ef migrations bundle \
          --project "Prisma/Code/Src/CSharp/02 Infrastructure/Veriqan.Infrastructure.Persistence/ExxerCube.Prisma.Veriqan.Infrastructure.Persistence.csproj" \
          --self-contained \
          -r linux-x64 \
          --output veriqan-efbundle \
          --force

    - name: Upload ef migrations bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: veriqan-efbundle
        path: veriqan-efbundle

    # From-zero verification: prove the bundle applies the FULL migration lineage cleanly to a
    # brand-new empty database, the same way a first-time production rollout would exercise it.
    - name: Start SQL Server 2022 container
      run: |
        docker run -d --name veriqan-migrate-verify \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}" \
          -p 14339:1433 \
          mcr.microsoft.com/mssql/server:2022-latest

    - name: Wait for SQL Server readiness
      run: |
        for i in $(seq 1 60); do
          if docker exec veriqan-migrate-verify /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "SQL Server did not become ready in time" >&2
        exit 1

    - name: Create empty verification database
      run: |
        docker exec veriqan-migrate-verify /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C \
          -Q "CREATE DATABASE VeriqanMigrationVerify"

    - name: Apply bundle from zero and assert success
      run: |
        chmod +x veriqan-efbundle
        ./veriqan-efbundle --connection "Server=localhost,14339;Database=VeriqanMigrationVerify;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"

    - name: Assert full migration lineage applied
      run: |
        applied=$(docker exec veriqan-migrate-verify /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -d VeriqanMigrationVerify \
          -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM veriqan.__EFMigrationsHistory")
        applied="$(echo "${applied}" | tr -d '[:space:]')"
        echo "Applied migrations: ${applied}"
        if [ "${applied}" -lt 1 ]; then
          echo "Expected at least one migration row in veriqan.__EFMigrationsHistory, found ${applied}" >&2
          exit 1
        fi

    - name: Tear down verification container
      if: always()
      run: |
        docker stop veriqan-migrate-verify || true
        docker rm veriqan-migrate-verify || true

  docker-build:
    name: Docker Build (all four production hosts)
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0

    # Build context is the repo root so all four Dockerfiles can COPY Prisma/Code/Src/CSharp/
    # and the root nuget.config in a single docker build invocation per image.

    - name: Build Orion Worker image
      run: |
        docker build \
          --build-arg APP_VERSION=$(git describe --tags --always) \
          -f "Prisma/Code/Src/CSharp/04 Services/Orion/Prisma.Orion.Worker/Dockerfile" \
          -t prisma-orion:${{ github.sha }} \
          .
      working-directory: ${{ github.workspace }}

    - name: Build Athena Worker image
      run: |
        docker build \
          --build-arg APP_VERSION=$(git describe --tags --always) \
          -f "Prisma/Code/Src/CSharp/04 Services/Athena/Prisma.Athena.Worker/Dockerfile" \
          -t prisma-athena:${{ github.sha }} \
          .
      working-directory: ${{ github.workspace }}

    # O1 (TRACKER-O1-athena-container-ocr.md): prove the built image can actually run OCR. The
    # --ocr-smoke mode renders a marker via Emgu.CV (libcvextern + noble system deps) and OCRs it
    # back via the production TesseractOcrExecutor (apt tesseract + link shims + spa tessdata) —
    # guarding against base-image rebases, apt package renames, and soname drift defeating the shims.
    - name: Athena in-container OCR smoke (--ocr-smoke)
      run: |
        docker run --rm --entrypoint dotnet \
          prisma-athena:${{ github.sha }} \
          ExxerCube.Prisma.Athena.Worker.dll --ocr-smoke

    - name: Build Reconciliator Worker image
      run: |
        docker build \
          --build-arg APP_VERSION=$(git describe --tags --always) \
          -f "Prisma/Code/Src/CSharp/04 Services/Reconciliator/Prisma.Reconciliator.Worker/Dockerfile" \
          -t prisma-reconciliator:${{ github.sha }} \
          .
      working-directory: ${{ github.workspace }}

    - name: Build Web UI image
      run: |
        docker build \
          --build-arg APP_VERSION=$(git describe --tags --always) \
          -f "Prisma/Code/Src/CSharp/07 UI/UI/ExxerCube.Prisma.Web.UI/Dockerfile" \
          -t prisma-webui:${{ github.sha }} \
          .
      working-directory: ${{ github.workspace }}

    # O1 follow-up (TRACKER-webui-container-ocr.md): prove the built Web.UI image can actually run
    # OCR, mirroring the Athena in-container OCR smoke above. The --ocr-smoke mode renders a marker
    # via Emgu.CV (libcvextern + noble system deps) and OCRs it back via the production
    # TesseractOcrExecutor (apt tesseract + link shims + spa tessdata) — guarding against base-image
    # rebases, apt package renames, and soname drift defeating the shims.
    - name: Web UI in-container OCR smoke (--ocr-smoke)
      run: |
        docker run --rm --entrypoint dotnet \
          prisma-webui:${{ github.sha }} \
          ExxerCube.Prisma.Web.UI.dll --ocr-smoke

  publish:
    # PRISMA-E2-S8 (closes D24): build → scan → tag (git SHA + latest) → push the four production
    # host images to a container registry. The multi-stage Dockerfiles run `dotnet publish` internally
    # (see each Dockerfile's build stage), so building via them IS the publish step. Runs ONLY on a
    # push to the release branch — never on PRs — to avoid polluting the registry.
    name: Publish Docker images (build, scan, push)
    runs-on: ubuntu-latest
    needs: [ quality-gates, docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io using the built-in GITHUB_TOKEN

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prisma-orion
            dockerfile: "Prisma/Code/Src/CSharp/04 Services/Orion/Prisma.Orion.Worker/Dockerfile"
          - name: prisma-athena
            dockerfile: "Prisma/Code/Src/CSharp/04 Services/Athena/Prisma.Athena.Worker/Dockerfile"
          - name: prisma-reconciliator
            dockerfile: "Prisma/Code/Src/CSharp/04 Services/Reconciliator/Prisma.Reconciliator.Worker/Dockerfile"
          - name: prisma-webui
            dockerfile: "Prisma/Code/Src/CSharp/07 UI/UI/ExxerCube.Prisma.Web.UI/Dockerfile"

    steps:
    - uses: actions/checkout@v3
      with:
        # O7: MinVer (git-tag-driven SemVer) needs full history + tags to compute a real version;
        # actions/checkout's default shallow clone (depth 1, no tags) leaves MinVer blind and it
        # falls back to its 0.0.0-alpha default. Needed by every job that runs dotnet build/restore
        # (MinVer) or docker build (--build-arg APP_VERSION=$(git describe ...) below).
        fetch-depth: 0

    # Resolve the target registry + image tag. Prefer a provisioned REGISTRY_URL secret (e.g. a
    # private ACR/ECR/Harbor); default to GitHub Container Registry namespaced to the repo owner.
    # No registry credentials are ever hardcoded in this file.
    - name: Resolve registry and tag
      id: reg
      run: |
        if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
          echo "registry=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
        else
          echo "registry=ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
        fi
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    # Authenticate. Use explicit REGISTRY_USERNAME/REGISTRY_PASSWORD secrets when provided; otherwise
    # fall back to the built-in GITHUB_TOKEN for ghcr.io.
    - name: Log in to container registry
      run: |
        if [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
          host="$(echo '${{ steps.reg.outputs.registry }}' | cut -d/ -f1)"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$host" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
        else
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        fi

    - name: Build image (${{ matrix.name }})
      run: |
        docker build \
          --build-arg APP_VERSION=$(git describe --tags --always) \
          -f "${{ matrix.dockerfile }}" \
          -t "${{ steps.reg.outputs.registry }}/${{ matrix.name }}:${{ steps.reg.outputs.sha }}" \
          -t "${{ steps.reg.outputs.registry }}/${{ matrix.name }}:latest" \
          .
      working-directory: ${{ github.workspace }}

    # Image-layer CVE scan. Fails the publish if a CRITICAL (fixed) vulnerability is found in the
    # built image so a vulnerable artifact never reaches the registry.
    - name: Scan image for CRITICAL CVEs (${{ matrix.name }})
      uses: aquasecurity/trivy-action@0.24.0
      with:
        image-ref: "${{ steps.reg.outputs.registry }}/${{ matrix.name }}:${{ steps.reg.outputs.sha }}"
        format: table
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Push image (${{ matrix.name }})
      run: |
        docker push "${{ steps.reg.outputs.registry }}/${{ matrix.name }}:${{ steps.reg.outputs.sha }}"
        docker push "${{ steps.reg.outputs.registry }}/${{ matrix.name }}:latest"
